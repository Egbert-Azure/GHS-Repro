---
layout: page
title: Kontakt
description:
permalink: /kontakt/
image: '/images/37.jpg'
---

<div class="form-box">
    <div class="contact-head">
    {% if site.data.settings.contact.description %}
      <p class="contact-description">{{site.data.settings.contact.description}}</p>
    {% endif %}
    </div>
    <form class="form" action="{% if site.data.settings.contact.email %}https://formspree.io/f/{{site.data.settings.contact.email}}{% else %}#{% endif %}" method="POST">
      <div class="form__group">
        <label class="form__label screen-reader-text" for="form-name">Dein Name</label>
        <input class="form__input" id="form-name" type="text" name="name" placeholder="Dein Name" required>
      </div>
      <div class="form__group">
        <label class="form__label screen-reader-text" for="form-email">Deine E-Mail-Adresse</label>
        <input class="form__input" id="form-email" type="email" name="_replyto" placeholder="Deine E-Mail-Adresse" required>
      </div>
      <div class="form__group">
        <label class="form__label screen-reader-text" for="form-text">Deine Nachricht</label>
        <textarea class="form__input" id="form-text" name="text" rows="8" placeholder="Deine Nachricht" required></textarea>
      </div>
      <div class="form__group">
        <button class="button" type="submit">Nachricht senden</button>
      </div>
    </form>
  </div>

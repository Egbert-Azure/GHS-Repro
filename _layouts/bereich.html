---
layout: default
---
<!-- Landing page of one of the site's areas (Neues, Erinnerungen, Schulgeschichte, Archiv) -->
<section class="hero bereich-hero">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="hero__inner">
          <h1 class="hero__title">{{ page.title }}</h1>
          {% if page.description %}<p class="hero__description">{{ page.description }}</p>{% endif %}
        </div>
      </div>
    </div>
  </div>
</section>

<div class="container bereich">
  {{ content }}
</div>

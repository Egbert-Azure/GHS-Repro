<svg xmlns="http://www.w3.org/2000/svg" width="460" height="460" viewBox="0 0 460 460" font-family="Noto Sans Display, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Schematische Zeichnung der beiden Chromatogramme aus Versuch 4: In Nr. 1 sind Chlorophyll a und b zu sehen, in Nr. 2 nicht.</title>
  <defs>
    <linearGradient id="papier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/><stop offset="1" stop-color="#f2ecdf"/>
    </linearGradient>
    <filter id="weich" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="460" height="460" rx="12" fill="#ffffff"/>

  <!-- headings -->
  <text x="64" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Nr. 1</text>
  <text x="64" y="50" text-anchor="middle" font-size="14" fill="#57606a">im Hellen</text>
  <text x="64" y="67" text-anchor="middle" font-size="14" fill="#57606a">gewachsen</text>
  <text x="396" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Nr. 2</text>
  <text x="396" y="50" text-anchor="middle" font-size="14" fill="#57606a">ohne Licht</text>
  <text x="396" y="67" text-anchor="middle" font-size="14" fill="#57606a">(Versuch 1c)</text>

  <!-- paper strips -->
  <rect x="24" y="84" width="80" height="356" rx="3" fill="url(#papier)" stroke="#d6cfbf"/>
  <rect x="356" y="84" width="80" height="356" rx="3" fill="url(#papier)" stroke="#d6cfbf"/>
  <g stroke="#8c959f" stroke-dasharray="5 4"><line x1="24" y1="104" x2="104" y2="104"/><line x1="356" y1="104" x2="436" y2="104"/></g>
  <g stroke="#8c959f"><line x1="24" y1="410" x2="104" y2="410"/><line x1="356" y1="410" x2="436" y2="410"/></g>

  <!-- Nr. 1: yellow pigments, chlorophyll a, chlorophyll b -->
  <ellipse cx="64" cy="134" rx="28" ry="6" fill="#f0a020" opacity=".9" filter="url(#weich)"/>
  <ellipse cx="64" cy="184" rx="30" ry="8" fill="#e3cc35" opacity=".9" filter="url(#weich)"/>
  <ellipse cx="64" cy="256" rx="32" ry="11" fill="#2e7d5b" filter="url(#weich)"/>
  <ellipse cx="64" cy="316" rx="32" ry="11" fill="#8db03c" filter="url(#weich)"/>
  <circle cx="64" cy="410" r="6" fill="#3d7a4a"/>

  <!-- Nr. 2: yellow pigments only -->
  <ellipse cx="396" cy="134" rx="28" ry="6" fill="#f0a020" opacity=".9" filter="url(#weich)"/>
  <ellipse cx="396" cy="184" rx="30" ry="8" fill="#e3cc35" opacity=".9" filter="url(#weich)"/>
  <ellipse cx="396" cy="256" rx="32" ry="11" fill="none" stroke="#b9b2a2" stroke-dasharray="4 4"/>
  <ellipse cx="396" cy="316" rx="32" ry="11" fill="none" stroke="#b9b2a2" stroke-dasharray="4 4"/>
  <text x="396" y="260" text-anchor="middle" font-size="13" fill="#8c959f">fehlt</text>
  <text x="396" y="320" text-anchor="middle" font-size="13" fill="#8c959f">fehlt</text>
  <circle cx="396" cy="410" r="6" fill="#d9c25a"/>

  <!-- shared labels in the middle -->
  <g stroke="#c4c9cf">
    <line x1="112" y1="134" x2="150" y2="134"/><line x1="310" y1="134" x2="348" y2="134"/>
    <line x1="112" y1="184" x2="150" y2="184"/><line x1="310" y1="184" x2="348" y2="184"/>
    <line x1="112" y1="256" x2="150" y2="256"/><line x1="310" y1="256" x2="348" y2="256"/>
    <line x1="112" y1="316" x2="150" y2="316"/><line x1="310" y1="316" x2="348" y2="316"/>
  </g>
  <text x="230" y="108" text-anchor="middle" font-size="14" fill="#57606a">Laufmittelfront</text>
  <text x="230" y="155" text-anchor="middle" font-size="16" fill="#1f2328">gelbe</text>
  <text x="230" y="174" text-anchor="middle" font-size="16" fill="#1f2328">Blattfarbstoffe</text>
  <text x="230" y="261" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Chlorophyll a</text>
  <text x="230" y="321" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Chlorophyll b</text>
  <text x="230" y="414" text-anchor="middle" font-size="14" fill="#57606a">Startlinie</text>
</svg>

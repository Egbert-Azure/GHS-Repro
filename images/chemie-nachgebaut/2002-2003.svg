  <!-- cup of hibiscus tea -->
  <g>
    <path d="M900 560h170l-18 120a30 30 0 0 1-30 25h-74a30 30 0 0 1-30-25z" fill="#ffffff" stroke="#d9d2c4" stroke-width="3"/>
    <ellipse cx="985" cy="560" rx="85" ry="16" fill="#a3203a"/>
    <path d="M1068 585c40 0 40 60 0 60" fill="none" stroke="#d9d2c4" stroke-width="10"/>
    <g fill="none" stroke="#c9bfae" stroke-width="4" stroke-linecap="round"><path d="M960 520c-10-20 10-30 0-50"/><path d="M1000 515c-10-20 10-30 0-50"/></g>
  </g>
</svg>

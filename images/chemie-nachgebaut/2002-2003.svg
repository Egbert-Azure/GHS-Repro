<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Zeichnung: rostiger Nagel, Stahlwolle und ein Blatt mit Geheimschrift neben einer Tasse Hibiskustee">
  <rect width="1200" height="800" fill="#f3efe7"/>
  <!-- steel wool -->
  <g fill="none" stroke="#8a8f96" stroke-width="3" opacity=".9">
    <path d="M150 560c40-60 120-70 170-30s40 110-20 130-150-10-160-60 30-90 90-80"/>
    <path d="M170 600c20-70 110-90 160-50s20 100-40 110-120-20-110-70 50-60 90-40"/>
    <path d="M190 545c60-40 130-10 140 40s-40 80-90 70-80-50-60-80"/>
  </g>
  <g fill="#b5562a" opacity=".75"><circle cx="230" cy="560" r="9"/><circle cx="285" cy="600" r="7"/><circle cx="205" cy="610" r="6"/><circle cx="300" cy="545" r="5"/></g>
  <!-- rusty nail -->
  <g transform="rotate(-28 420 400)">
    <rect x="330" y="385" width="300" height="26" rx="6" fill="#9aa1a8"/>
    <rect x="300" y="365" width="34" height="66" rx="6" fill="#7e858c"/>
    <path d="M630 385l50 13-50 13z" fill="#9aa1a8"/>
    <g fill="#b5562a"><ellipse cx="420" cy="398" rx="26" ry="12"/><ellipse cx="520" cy="405" rx="18" ry="10"/><ellipse cx="590" cy="395" rx="14" ry="8"/></g>
  </g>
  <!-- paper with secret writing -->
  <g transform="rotate(4 820 400)">
    <rect x="660" y="190" width="330" height="420" rx="6" fill="#ffffff" stroke="#e3ddd0"/>
    <g stroke="#e8e2d6" stroke-width="3"><line x1="700" y1="260" x2="950" y2="260"/><line x1="700" y1="310" x2="950" y2="310"/><line x1="700" y1="360" x2="950" y2="360"/><line x1="700" y1="410" x2="950" y2="410"/><line x1="700" y1="460" x2="950" y2="460"/></g>
    <g fill="none" stroke="#7a3b8f" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M705 300c15-25 30 20 45-5s30 15 45-5 30 15 45-5"/>
      <path d="M705 350c20-20 35 15 55-5s30 10 50-5"/>
      <path d="M705 400c15-22 30 18 45-4s30 16 45-4 25 12 40-2"/>
    </g>

    <ellipse cx="260" cy="470" rx="95" ry="75"/><ellipse cx="370" cy="400" rx="45" ry="38"/>
    <ellipse cx="200" cy="600" rx="70" ry="55"/><ellipse cx="400" cy="590" rx="80" ry="62"/><ellipse cx="470" cy="520" rx="34" ry="28"/>
